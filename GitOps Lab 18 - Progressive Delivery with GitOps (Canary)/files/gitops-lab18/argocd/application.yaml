apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-canary
spec:
  destination:
    namespace: production
    server: https://kubernetes.default.svc
  project: default
  source:
    path: apps/demo-app/overlays/production
    repoURL: http://172.17.0.1:8772/gitops-canary.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
