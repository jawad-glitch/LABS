node:
  id: istio-ingressgateway.istio-system~sidecar
  cluster: istio-ingressgateway.istio-system
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 15000
static_resources:
  listeners:
  - name: 0.0.0.0_8080
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: istio-ingressgateway.istio-system
          generate_request_id: true
          tracing:
            random_sampling:
              value: 100
            provider:
              name: envoy.tracers.zipkin
              typed_config:
                '@type': type.googleapis.com/envoy.config.trace.v3.ZipkinConfig
                collector_cluster: zipkin
                collector_endpoint: /api/v2/spans
                collector_endpoint_version: HTTP_JSON
                shared_span_context: false
          route_config:
            name: istio-ingressgateway.istio-system
            virtual_hosts:
            - name: istio-ingressgateway.istio-system
              domains:
              - '*'
              routes:
              - match:
                  path: /productpage
                route:
                  cluster: productpage
              - match:
                  prefix: /static
                route:
                  cluster: productpage
              - match:
                  path: /login
                route:
                  cluster: productpage
              - match:
                  path: /logout
                route:
                  cluster: productpage
              - match:
                  prefix: /api/v1/products
                route:
                  cluster: productpage
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: zipkin
    type: STRICT_DNS
    connect_timeout: 2s
    lb_policy: ROUND_ROBIN
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: zipkin
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: jaeger
                port_value: 9411
  - name: productpage
    type: STRICT_DNS
    connect_timeout: 2s
    lb_policy: ROUND_ROBIN
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: productpage
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: productpage
                port_value: 9080

