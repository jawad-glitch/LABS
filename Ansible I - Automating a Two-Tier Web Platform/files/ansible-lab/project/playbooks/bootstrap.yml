---
- name: Bootstrap Python on fresh nodes
  hosts: all
  gather_facts: false
  become: true
  tags: [always]
  tasks:
    - name: Install python3 and python3-apt if missing
      ansible.builtin.raw: >
        test -e /usr/bin/python3 && echo PRESENT ||
        (apt-get update -qq &&
         DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-apt >/dev/null &&
         echo INSTALLED)
      register: bootstrap
      changed_when: "'INSTALLED' in bootstrap.stdout"
