apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: control-plane
spec:
  values:
    pilot:
      traceSampling: 100.0
    global:
      tracer:
        zipkin:
          address: jaeger-service.jaeger.svc.cluster.local:9411
  meshConfig:
    defaultConfig:
      tracing:
        sampling: 100.0
        zipkin:
          address: jaeger-service.jaeger.svc.cluster.local:9411
