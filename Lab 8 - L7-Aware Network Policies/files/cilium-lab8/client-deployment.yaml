apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: l7-policy-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
      - name: client
        image: curlimages/curl:latest
        command: ["sleep", "3600"]
