apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: demo
    managed-by: argocd
    name: demo-app
  name: demo-app
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: nginx
    environment: demo
    managed-by: argocd
  name: nginx-service
  namespace: demo-app
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: nginx
    environment: demo
    managed-by: argocd
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx
    environment: demo
    managed-by: argocd
  name: nginx-deployment
  namespace: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
      environment: demo
      managed-by: argocd
  template:
    metadata:
      labels:
        app: nginx
        environment: demo
        managed-by: argocd
    spec:
      containers:
      - image: nginx:1.27-alpine
        name: nginx
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 250m
            memory: 64Mi
