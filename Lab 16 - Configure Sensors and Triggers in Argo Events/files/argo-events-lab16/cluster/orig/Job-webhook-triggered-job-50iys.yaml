apiVersion: batch/v1
kind: Job
metadata:
  namespace: argo-events
  name: webhook-triggered-job-50iys
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: job-container
        image: alpine:latest
        command:
        - /bin/sh
        args:
        - -c
        - echo 'Job triggered by webhook event at $(date)'; sleep 10
