apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-registry-app
  labels:
    app: bad-registry-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad-registry-app
  template:
    metadata:
      labels:
        app: bad-registry-app
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: web-server
        image: untrusted-registry.com/nginx:1.21.6
        ports:
        - containerPort: 80
