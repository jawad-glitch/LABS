apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-productpage-to-details
  namespace: default
spec:
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/default/sa/bookinfo-productpage
    to:
    - operation:
        methods:
        - GET
        paths:
        - /details/*
  selector:
    matchLabels:
      app: details
