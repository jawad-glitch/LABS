# Fixed v2: the failure happens on the SERVER (real HTTP 500 for ~70% of requests), so health checks, curl -f and outlier detection can see it.
split_clients "${request_id}" $bookstore_fail { 70% 1; * 0; }
server {
    listen 80;
    location / { if ($bookstore_fail) { return 500 "<h1>500 Internal Server Error</h1>\n"; } root /usr/share/nginx/html; index index.html; }
}
