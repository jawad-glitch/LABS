spec:
  arguments:
    parameters:
    - name: environment
      value: production
    - name: version
      value: 2.1.0
    - name: config-data
      value: '{"database": "mysql", "cache": "memcached", "logging": "info", "replicas":
        3}'
  entrypoint: main-pipeline
  templates:
  - dag:
      tasks:
      - arguments:
          parameters:
          - name: env
            value: '{{inputs.parameters.environment}}'
          - name: ver
            value: '{{inputs.parameters.version}}'
          - name: config
            value: '{{inputs.parameters.config-data}}'
        name: setup-config
        template: config-generator
      - arguments:
          artifacts:
          - from: '{{tasks.setup-config.outputs.artifacts.config-artifact}}'
            name: config-file
          parameters:
          - name: environment
            value: '{{inputs.parameters.environment}}'
        dependencies:
        - setup-config
        name: validate-config
        template: config-validator
      - arguments:
          artifacts:
          - from: '{{tasks.validate-config.outputs.artifacts.validation-result}}'
            name: validated-config
          parameters:
          - name: version
            value: '{{inputs.parameters.version}}'
        dependencies:
        - validate-config
        name: generate-report
        template: report-generator
    inputs:
      parameters:
      - name: environment
      - name: version
      - name: config-data
    metadata: {}
    name: main-pipeline
    outputs: {}
  - container:
      args:
      - |
        echo "Generating configuration for environment: {{inputs.parameters.env}}"
        echo "Version: {{inputs.parameters.ver}}"
        echo '{{inputs.parameters.config}}' | jq --arg env "{{inputs.parameters.env}}" --arg ver "{{inputs.parameters.ver}}" --arg ts "$(date)" \
          '. + {"environment": $env, "version": $ver, "generated_at": $ts}' > /tmp/config.json
        CONFIG_HASH=$(sha256sum /tmp/config.json | cut -d' ' -f1)
        echo $CONFIG_HASH > /tmp/hash.txt
        echo "Generated configuration:"
        cat /tmp/config.json
        echo "Config hash: $CONFIG_HASH"
      command:
      - sh
      - -c
      image: lab5-tools:1
      name: ""
      resources: {}
    inputs:
      parameters:
      - name: env
      - name: ver
      - name: config
    metadata: {}
    name: config-generator
    outputs:
      artifacts:
      - name: config-artifact
        path: /tmp/config.json
      parameters:
      - name: config-hash
        valueFrom:
          path: /tmp/hash.txt
  - container:
      args:
      - |
        echo "Validating configuration for environment: {{inputs.parameters.environment}}"
        cat /tmp/input-config.json
        VALIDATION_STATUS="valid"
        VALIDATION_MESSAGE="Configuration is valid for {{inputs.parameters.environment}} environment"
        jq -n --arg status "$VALIDATION_STATUS" \
              --arg message "$VALIDATION_MESSAGE" \
              --arg validated_at "$(date)" \
              --argjson config "$(cat /tmp/input-config.json)" \
              '{"validation_status": $status, "message": $message, "validated_at": $validated_at, "original_config": $config}' > /tmp/validation.json
        echo "Validation result:"
        cat /tmp/validation.json
      command:
      - sh
      - -c
      image: lab5-tools:1
      name: ""
      resources: {}
    inputs:
      artifacts:
      - name: config-file
        path: /tmp/input-config.json
      parameters:
      - name: environment
    metadata: {}
    name: config-validator
    outputs:
      artifacts:
      - name: validation-result
        path: /tmp/validation.json
  - container:
      args:
      - |
        echo "Generating final report for version: {{inputs.parameters.version}}"
        STATUS=$(jq -r '.validation_status' /tmp/validated.json)
        MESSAGE=$(jq -r '.message' /tmp/validated.json)
        VALIDATED_AT=$(jq -r '.validated_at' /tmp/validated.json)
        cat > /tmp/report.html << HTML
        <!DOCTYPE html>
        <html>
        <head>
            <title>Configuration Report - Version {{inputs.parameters.version}}</title>
            <style>
                body { font-family: Arial, sans-serif; margin: 20px; }
                .header { background-color: #f0f0f0; padding: 10px; }
                .status { color: green; font-weight: bold; }
                .config { background-color: #f9f9f9; padding: 10px; border: 1px solid #ddd; }
            </style>
        </head>
        <body>
            <div class="header">
                <h1>Configuration Report</h1>
                <p>Version: {{inputs.parameters.version}}</p>
                <p>Generated: $(date)</p>
            </div>
            <h2>Validation Results</h2>
            <p class="status">Status: $STATUS</p>
            <p>Message: $MESSAGE</p>
            <p>Validated At: $VALIDATED_AT</p>
            <h2>Configuration Details</h2>
            <div class="config">
                <pre>$(jq '.original_config' /tmp/validated.json)</pre>
            </div>
        </body>
        </html>
        HTML
        echo "Report generated successfully"
        echo "Report preview:"
        head -20 /tmp/report.html
      command:
      - sh
      - -c
      image: lab5-tools:1
      name: ""
      resources: {}
    inputs:
      artifacts:
      - name: validated-config
        path: /tmp/validated.json
      parameters:
      - name: version
    metadata: {}
    name: report-generator
    outputs:
      artifacts:
      - name: final-report
        path: /tmp/report.html
