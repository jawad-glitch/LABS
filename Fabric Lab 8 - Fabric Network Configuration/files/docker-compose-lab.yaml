networks:
  fabric_lab:
    name: fabric_lab

services:
  orderer.example.com:
    image: hyperledger/fabric-orderer:2.5.9
    container_name: orderer.example.com
    environment: [FABRIC_LOGGING_SPEC=INFO]
    volumes:
      - ./custom-config/orderer.yaml:/etc/hyperledger/fabric/orderer.yaml:ro
      - /home/ubuntu/fabric-lab8/fabric-samples/test-network/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/var/hyperledger/orderer/msp:ro
      - /home/ubuntu/fabric-lab8/fabric-samples/test-network/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls:/var/hyperledger/orderer/tls:ro
    ports: ["7050:7050", "7053:7053"]
    networks: [fabric_lab]
  peer0.org1.example.com:
    image: hyperledger/fabric-peer:2.5.9
    container_name: peer0.org1.example.com
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.org1.example.com
      - CORE_PEER_ADDRESS=peer0.org1.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.example.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.example.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.example.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
    volumes:
      - ./custom-config/core.yaml:/etc/hyperledger/peercfg/core.yaml:ro
      - /home/ubuntu/fabric-lab8/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/msp:/etc/hyperledger/fabric/msp:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["7051:7051"]
    networks: [fabric_lab]
  peer0.org2.example.com:
    image: hyperledger/fabric-peer:2.5.9
    container_name: peer0.org2.example.com
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.org2.example.com
      - CORE_PEER_ADDRESS=peer0.org2.example.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org2.example.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org2.example.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org2.example.com:9051
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
    volumes:
      - ./custom-config/core.yaml:/etc/hyperledger/peercfg/core.yaml:ro
      - /home/ubuntu/fabric-lab8/fabric-samples/test-network/organizations/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/msp:/etc/hyperledger/fabric/msp:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["9051:9051"]
    networks: [fabric_lab]
