---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: staging-apps
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/staging
  prune: true
  serviceAccountName: flux-staging
  sourceRef:
    kind: GitRepository
    name: staging-repo
  targetNamespace: staging
  timeout: 2m0s
  wait: true
