admin: {address: {socket_address: {address: 0.0.0.0, port_value: 15000}}}
static_resources:
  listeners:
  - name: virtualInbound
    address: {socket_address: {address: 0.0.0.0, port_value: 15006}}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: inbound
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format: {text_format_source: {inline_string: "ACCESS %REQ(:METHOD)% %REQ(:PATH)% %RESPONSE_CODE% authority=%REQ(:AUTHORITY)% rid=%REQ(X-REQUEST-ID)%\n"}}
          route_config:
            name: inbound|9080||
            virtual_hosts: [{name: inbound, domains: ["*"], routes: [{match: {prefix: "/"}, route: {cluster: "inbound|9080||"}}], virtual_clusters: [{name: shadow, headers: [{name: ":authority", string_match: {contains: "-shadow"}}]}]}]
          http_filters: [{name: envoy.filters.http.router, typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}}]
  clusters:
  - name: "inbound|9080||"
    type: STATIC
    connect_timeout: 2s
    load_assignment: {cluster_name: "inbound|9080||", endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: 127.0.0.1, port_value: 9080}}}}]}]}
