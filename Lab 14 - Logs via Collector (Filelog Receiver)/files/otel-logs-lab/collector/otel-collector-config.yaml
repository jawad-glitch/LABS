receivers:
  # Filelog receiver to read JSON logs (each line arrives in 'body')
  filelog:
    include: ["/var/log/app/app.log"]
    start_at: beginning
    operators:
      - type: json_parser
        id: json_parser
        parse_from: body
        parse_to: attributes
        timestamp:
          parse_from: attributes.timestamp
          layout_type: gotime
          layout: '2006-01-02T15:04:05.999999Z'
        severity:
          parse_from: attributes.level
      - type: trace_parser
        id: trace_parser
        if: 'attributes.trace_id != nil'
        trace_id:
          parse_from: attributes.trace_id
        span_id:
          parse_from: attributes.span_id
      - type: move
        id: move_message
        from: attributes.message
        to: body
      - type: move
        id: move_service
        from: attributes.service
        to: resource["service.name"]

  # OTLP receiver for traces
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Batch processor for efficient processing
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Resource processor: insert = only when missing (upsert overwrote the app's service.name)
  resource:
    attributes:
      - key: service.name
        value: "log-collector"
        action: insert
      - key: service.version
        value: "1.0.0"
        action: upsert

exporters:
  # Debug exporter (replaces the removed 'logging' exporter)
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200

  # Jaeger ingests OTLP natively (the 'jaeger' exporter was removed from the collector)
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    # Logs pipeline
    logs:
      receivers: [filelog]
      processors: [resource, batch]
      exporters: [debug]

    # Traces pipeline
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp/jaeger, debug]

  extensions: []
