apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: resource-eventsource
  namespace: argo-events
spec:
  template:
    serviceAccountName: sensor-trigger-sa
  resource:
    chain-cm:
      namespace: argo-events
      group: ""
      version: v1
      resource: configmaps
      eventTypes: [ADD]
      filter:
        labels:
          - key: trigger-type
            operation: "=="
            value: chain-event
