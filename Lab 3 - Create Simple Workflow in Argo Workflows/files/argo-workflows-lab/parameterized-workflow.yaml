apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: parameterized-
spec:
  entrypoint: print-params
  arguments:
    parameters:
    - name: greeting
      value: "Hello"
    - name: name
      value: "Argo User"
  templates:
  - name: print-params
    inputs:
      parameters:
      - name: greeting
        value: "{{workflow.parameters.greeting}}"
      - name: name
        value: "{{workflow.parameters.name}}"
    container:
      image: alpine:3.16
      command: [sh, -c]
      args: ["echo '{{inputs.parameters.greeting}}, {{inputs.parameters.name}}!'"]
