global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: 'cluster-b'
    region: 'us-west'

scrape_configs:
  - job_name: 'prometheus-cluster-b'
    static_configs:
      - targets: ['localhost:9091']

  - job_name: 'node-exporter-cluster-b'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          cluster: 'cluster-b'

  - job_name: 'application-cluster-b'
    static_configs:
      - targets: ['localhost:8080']
        labels:
          cluster: 'cluster-b'
