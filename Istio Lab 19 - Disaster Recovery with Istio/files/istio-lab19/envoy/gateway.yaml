admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 15000
static_resources:
  listeners:
  - name: 0.0.0.0_8080
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: gateway
          route_config:
            name: http.8080
            virtual_hosts:
            - name: bookstore
              domains:
              - '*'
              routes:
              - match:
                  prefix: /
                route:
                  weighted_clusters:
                    clusters:
                    - name: outbound|80|v1|bookstore-service.disaster-recovery.svc.cluster.local
                      weight: 100
                  timeout: 10s
          http_filters:
          - name: envoy.filters.http.fault
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.fault.v3.HTTPFault
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: outbound|80|v1|bookstore-service.disaster-recovery.svc.cluster.local
    type: STATIC
    connect_timeout: 2s
    lb_policy: ROUND_ROBIN
    common_lb_config:
      healthy_panic_threshold:
        value: 0
    load_assignment:
      cluster_name: outbound|80|v1|bookstore-service.disaster-recovery.svc.cluster.local
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 172.18.0.2
                port_value: 80
        - endpoint:
            address:
              socket_address:
                address: 172.18.0.4
                port_value: 80
        - endpoint:
            address:
              socket_address:
                address: 172.18.0.6
                port_value: 80
  - name: outbound|80|v2|bookstore-service.disaster-recovery.svc.cluster.local
    type: STATIC
    connect_timeout: 2s
    lb_policy: ROUND_ROBIN
    common_lb_config:
      healthy_panic_threshold:
        value: 0
    load_assignment:
      cluster_name: outbound|80|v2|bookstore-service.disaster-recovery.svc.cluster.local
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 172.18.0.3
                port_value: 80
        - endpoint:
            address:
              socket_address:
                address: 172.18.0.5
                port_value: 80
        - endpoint:
            address:
              socket_address:
                address: 172.18.0.7
                port_value: 80

