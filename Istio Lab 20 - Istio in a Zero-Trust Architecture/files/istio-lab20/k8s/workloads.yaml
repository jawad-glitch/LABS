apiVersion: v1
kind: ServiceAccount
metadata: {name: frontend-sa, namespace: zero-trust-demo}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: backend-sa, namespace: zero-trust-demo}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: database-sa, namespace: zero-trust-demo}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: zero-trust-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend, version: v1}}
  template:
    metadata: {labels: {app: frontend, version: v1}}
    spec:
      serviceAccountName: frontend-sa
      containers: [{name: frontend, image: "nginx:1.27-alpine", ports: [{containerPort: 80}]}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: zero-trust-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: backend, version: v1}}
  template:
    metadata: {labels: {app: backend, version: v1}}
    spec:
      serviceAccountName: backend-sa
      containers: [{name: backend, image: "httpd:2.4", ports: [{containerPort: 80}]}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: database, namespace: zero-trust-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: database, version: v1}}
  template:
    metadata: {labels: {app: database, version: v1}}
    spec:
      serviceAccountName: database-sa
      containers: [{name: database, image: "nginx:1.27-alpine", ports: [{containerPort: 80}]}]
---
# test client with curl, instead of exec into images that lack it (httpd:2.4 has no curl)
apiVersion: v1
kind: Pod
metadata: {name: curl-backend-identity, namespace: zero-trust-demo, labels: {app: curl-client}}
spec:
  serviceAccountName: backend-sa
  containers: [{name: curl, image: "curlimages/curl:8.11.1", command: ["sleep", "infinity"]}]
