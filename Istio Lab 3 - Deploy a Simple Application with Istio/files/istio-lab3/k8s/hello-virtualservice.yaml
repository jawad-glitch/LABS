apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: hello-virtualservice
spec:
  hosts: ["*"]
  gateways: [hello-gateway]
  http:
  - match: [{uri: {prefix: /frontend}}]
    rewrite: {uri: /}
    route: [{destination: {host: hello-frontend, port: {number: 8080}}}]
  - match: [{uri: {prefix: /backend}}]
    rewrite: {uri: /}
    route: [{destination: {host: hello-backend, port: {number: 8080}}}]
  - match: [{uri: {prefix: /}}]
    route: [{destination: {host: hello-frontend, port: {number: 8080}}}]
