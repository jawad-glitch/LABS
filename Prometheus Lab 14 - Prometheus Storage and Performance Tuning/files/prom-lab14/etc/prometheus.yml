global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'prometheus-lab'
    replica: 'prometheus-01'

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 5s
    
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 10s

  - job_name: 'thanos-sidecar'
    static_configs:
      - targets: ['localhost:10902']
    scrape_interval: 15s
    
  - job_name: 'thanos-store'
    static_configs:
      - targets: ['localhost:10904']
    scrape_interval: 15s
    
  - job_name: 'thanos-querier'
    static_configs:
      - targets: ['localhost:10905']
    scrape_interval: 15s
