apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: default
  labels: {app: web-app, cluster: cluster2}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web-app}
  template:
    metadata:
      labels: {app: web-app, cluster: cluster2}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        command: ["/bin/sh", "-c"]
        args: ["echo \"cluster=$CLUSTER_NAME pod=$HOSTNAME\" > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"]
        env:
        - {name: CLUSTER_NAME, value: "cluster2"}
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: default
  annotations:
    service.cilium.io/global: "true"
    service.cilium.io/shared: "true"
spec:
  selector: {app: web-app}
  ports:
  - {port: 80, targetPort: 80}
---
apiVersion: v1
kind: Pod
metadata:
  name: test-connectivity
  namespace: default
  labels: {app: test-client}
spec:
  containers:
  - name: test
    image: curlimages/curl:8.11.1
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: unauthorized-test
  namespace: default
  labels: {app: unauthorized}
spec:
  containers:
  - name: test
    image: curlimages/curl:8.11.1
    command: ["sleep", "3600"]
