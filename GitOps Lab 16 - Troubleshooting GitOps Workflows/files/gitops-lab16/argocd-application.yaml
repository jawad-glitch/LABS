apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp-dev
spec:
  destination:
    namespace: dev
    server: https://kubernetes.default.svc
  project: default
  source:
    path: environments/dev
    repoURL: http://172.17.0.1:8770/gitops-troubleshooting-lab.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
