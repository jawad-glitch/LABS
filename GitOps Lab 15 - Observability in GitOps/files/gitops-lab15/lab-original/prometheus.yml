global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  # - "first_rules.yml"
scrape_configs:
  - job_name: 'prometheus'
    static_configs: [{targets: ['localhost:9090']}]
  - job_name: 'argocd-application-controller'
    static_configs: [{targets: ['argocd-application-controller-metrics.argocd.svc.cluster.local:8082']}]
  - job_name: 'argocd-server'
    static_configs: [{targets: ['argocd-server-metrics.argocd.svc.cluster.local:8083']}]
  - job_name: 'argocd-repo-server'
    static_configs: [{targets: ['argocd-repo-server-metrics.argocd.svc.cluster.local:8084']}]
