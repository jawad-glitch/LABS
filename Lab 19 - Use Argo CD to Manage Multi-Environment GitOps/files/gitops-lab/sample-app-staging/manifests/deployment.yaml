apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: sample-app-staging
  labels:
    app: sample-app
    environment: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
        environment: staging
    spec:
      containers:
      - name: sample-app
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        env:
        - name: ENVIRONMENT
          value: "staging"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
