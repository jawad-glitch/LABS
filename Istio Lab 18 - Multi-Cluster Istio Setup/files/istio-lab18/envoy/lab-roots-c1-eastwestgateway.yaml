admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 15000
static_resources:
  listeners:
  - name: 0.0.0.0_15443
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 15443
    filter_chains:
    - filter_chain_match:
        server_names:
        - outbound_.8000_._.httpbin.default.svc.cluster.local
      filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: sni_passthrough
          cluster: httpbin-local-endpoints
    listener_filters:
    - name: envoy.filters.listener.tls_inspector
      typed_config:
        '@type': type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
  clusters:
  - name: httpbin-local-endpoints
    type: STATIC
    connect_timeout: 2s
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: httpbin-local-endpoints
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 172.18.0.2
                port_value: 15006

