apiVersion: v1
kind: Pod
metadata: {name: dns-isolated, namespace: test-apps, labels: {app: dns-isolated}}
spec:
  dnsPolicy: None
  dnsConfig:
    nameservers: ["8.8.8.8"]
  containers:
  - {name: c, image: "busybox:1.36", imagePullPolicy: IfNotPresent, command: [sleep, "3600"]}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dns-isolated-dns-visibility
  namespace: test-apps
  annotations: {lab/purpose: "Route the isolated pod's DNS through Cilium's DNS proxy so Hubble records queries and NXDOMAIN answers"}
spec:
  endpointSelector: {matchLabels: {app: dns-isolated}}
  egress:
  - toEntities: [world]
    toPorts:
    - ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]
      rules: {dns: [{matchPattern: "*"}]}
