apiVersion: v1
kind: Namespace
metadata: {name: test-apps}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: test-apps}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend, tier: frontend}}
  template:
    metadata: {labels: {app: frontend, tier: frontend}}
    spec: {containers: [{name: web, image: "nginx:1.27-alpine", imagePullPolicy: IfNotPresent, ports: [{containerPort: 80}]}]}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: test-apps}
spec: {selector: {tier: frontend}, ports: [{port: 80, targetPort: 80}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: test-apps}
spec:
  replicas: 1
  selector: {matchLabels: {app: backend, tier: backend}}
  template:
    metadata: {labels: {app: backend, tier: backend}}
    spec: {containers: [{name: web, image: "nginx:1.27-alpine", imagePullPolicy: IfNotPresent, ports: [{containerPort: 80}]}]}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: test-apps}
spec: {selector: {tier: backend}, ports: [{port: 80, targetPort: 80}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: database, namespace: test-apps}
spec:
  replicas: 1
  selector: {matchLabels: {app: database, tier: database}}
  template:
    metadata: {labels: {app: database, tier: database}}
    spec: {containers: [{name: redis, image: "redis:7-alpine", imagePullPolicy: IfNotPresent, ports: [{containerPort: 6379}]}]}
---
apiVersion: v1
kind: Service
metadata: {name: database, namespace: test-apps}
spec: {selector: {tier: database}, ports: [{port: 6379, targetPort: 6379}]}
