services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: multitenant
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: LabDB-Only-Change-Me
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser -d multitenant"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://labuser:LabDB-Only-Change-Me@postgres:5432/multitenant
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: lab-only-signing-secret-change-for-production
      JWT_EXPIRE_MINUTES: "60"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
