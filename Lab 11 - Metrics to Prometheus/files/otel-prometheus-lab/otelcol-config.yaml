receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # HTTP check receiver - probes the app on the HOST (container's localhost is the container itself)
  httpcheck:
    targets:
      - endpoint: http://host.docker.internal:8080/health
    collection_interval: 10s

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

  memory_limiter:
    check_interval: 1s
    limit_mib: 512

exporters:
  # Prometheus exporter - exposes PIPELINE metrics (httpcheck, OTLP) on port 9464
  prometheus:
    endpoint: "0.0.0.0:9464"
    namespace: "otelcol"
    const_labels:
      environment: "lab"

  # Debug exporter (replaces the removed 'logging' exporter)
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp, httpcheck]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]

  telemetry:
    logs:
      level: "info"
    # Collector's OWN metrics (otelcol_processor_batch_*, otelcol_receiver_*, otelcol_exporter_*) on 8888
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
