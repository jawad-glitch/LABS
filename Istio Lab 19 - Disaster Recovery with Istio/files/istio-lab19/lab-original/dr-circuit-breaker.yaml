apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: bookstore-dr
  namespace: disaster-recovery
spec:
  host: bookstore-service
  subsets:
  - name: v1
    labels:
      version: v1
  - name: v2
    labels:
      version: v2
    trafficPolicy:
      outlierDetection:
        consecutiveErrors: 2
        interval: 10s
        baseEjectionTime: 10s
        maxEjectionPercent: 100
  trafficPolicy:
    outlierDetection:
      consecutiveErrors: 3
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
