apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-app-dev
spec:
  destination:
    namespace: dev
    server: https://kubernetes.default.svc
  project: default
  source:
    path: k8s-manifests/dev
    repoURL: http://172.17.0.1:8767/gitops-multi-env.git
    targetRevision: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
