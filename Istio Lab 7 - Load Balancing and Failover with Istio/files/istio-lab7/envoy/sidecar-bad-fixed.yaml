admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 15000
static_resources:
  listeners:
  - name: outbound_9080
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 9080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: outbound_0.0.0.0_9080
          route_config:
            name: '9080'
            virtual_hosts:
            - name: details
              domains:
              - '*'
              routes:
              - match:
                  prefix: /
                route:
                  cluster: outbound|9080|v1|details.lab7-loadbalancing.svc.cluster.local
                  timeout: 10s
                  retry_policy:
                    retry_on: connect-failure,refused-stream,unavailable,cancelled,5xx
                    num_retries: 3
                    per_try_timeout: 2s
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: outbound|9080|v1|details.lab7-loadbalancing.svc.cluster.local
    type: STATIC
    connect_timeout: 1s
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: outbound|9080|v1|details.lab7-loadbalancing.svc.cluster.local
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 172.18.0.5
                port_value: 9080
        - endpoint:
            address:
              socket_address:
                address: 172.18.0.3
                port_value: 9080
        - endpoint:
            address:
              socket_address:
                address: 172.18.0.4
                port_value: 9080
    circuit_breakers:
      thresholds:
      - max_connections: 10
        max_pending_requests: 10
    outlier_detection:
      interval: 5s
      base_ejection_time: 30s
      max_ejection_percent: 50
      consecutive_5xx: 3
      enforcing_consecutive_5xx: 100

