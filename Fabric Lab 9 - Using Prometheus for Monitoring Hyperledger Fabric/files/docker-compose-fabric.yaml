networks:
  fabric_test:
    name: fabric_test
services:
  orderer.example.com:
    image: hyperledger/fabric-orderer:2.5.4
    container_name: orderer.example.com
    environment:
      - ORDERER_METRICS_PROVIDER=prometheus
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:9445
    volumes:
      - /home/ubuntu/fabric-monitoring-lab/network-config/orderer.yaml:/etc/hyperledger/fabric/orderer.yaml:ro
      - /home/ubuntu/fabric-monitoring-lab/fabric-samples/test-network/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/var/hyperledger/orderer/msp:ro
      - /home/ubuntu/fabric-monitoring-lab/fabric-samples/test-network/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls:/var/hyperledger/orderer/tls:ro
    ports: ["7050:7050", "7053:7053", "9445:9445"]
    networks: [fabric_test]
  peer0.org1.example.com:
    image: hyperledger/fabric-peer:2.5.4
    container_name: peer0.org1.example.com
    environment:
      - CORE_PEER_ID=peer0.org1.example.com
      - CORE_PEER_ADDRESS=peer0.org1.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.example.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.example.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.example.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=false
      - CORE_VM_ENDPOINT=
      - CORE_METRICS_PROVIDER=prometheus
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9443
    volumes: ["/home/ubuntu/fabric-monitoring-lab/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/msp:/etc/hyperledger/fabric/msp:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["7051:7051", "9443:9443"]
    networks: [fabric_test]
  peer0.org2.example.com:
    image: hyperledger/fabric-peer:2.5.4
    container_name: peer0.org2.example.com
    environment:
      - CORE_PEER_ID=peer0.org2.example.com
      - CORE_PEER_ADDRESS=peer0.org2.example.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org2.example.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org2.example.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org2.example.com:9051
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=false
      - CORE_VM_ENDPOINT=
      - CORE_METRICS_PROVIDER=prometheus
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9444
    volumes: ["/home/ubuntu/fabric-monitoring-lab/fabric-samples/test-network/organizations/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/msp:/etc/hyperledger/fabric/msp:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["9051:9051", "9444:9444"]
    networks: [fabric_test]
