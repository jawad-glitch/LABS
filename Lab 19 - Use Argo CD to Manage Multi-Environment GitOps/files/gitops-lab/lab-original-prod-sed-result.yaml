apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: sample-app-prod
  labels:
    version: "1.0.1"
    app: sample-app
    environment: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
    version: "1.0.1"
        app: sample-app
        environment: prod
    spec:
      containers:
      - name: sample-app
        image: nginx:1.26-alpine
        ports:
        - containerPort: 80
        env:
        - name: ENVIRONMENT
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
