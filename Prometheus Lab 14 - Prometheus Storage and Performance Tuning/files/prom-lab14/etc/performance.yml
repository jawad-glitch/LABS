groups:
  - name: prometheus_performance
    rules:
      - alert: PrometheusHighMemoryUsage
        expr: process_resident_memory_bytes{job="prometheus"} / 1024 / 1024 > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus memory usage is high"
          description: "Prometheus is using {{ $value }}MB of memory"

      - alert: PrometheusHighCPUUsage  
        expr: rate(process_cpu_seconds_total{job="prometheus"}[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus CPU usage is high"
          description: "Prometheus CPU usage is {{ $value }}%"

      - alert: PrometheusSlowQueries
        expr: histogram_quantile(0.95, rate(prometheus_engine_query_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus queries are slow"
          description: "95th percentile query duration is {{ $value }}s"

      - alert: PrometheusHighIngestionRate
        expr: rate(prometheus_tsdb_head_samples_appended_total[5m]) > 10000
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High sample ingestion rate"
          description: "Ingesting {{ $value }} samples per second"
