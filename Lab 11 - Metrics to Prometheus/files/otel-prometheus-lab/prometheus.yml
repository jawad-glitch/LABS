global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Pipeline metrics from the collector's prometheus exporter (httpcheck etc.)
  - job_name: 'otelcol'
    static_configs:
      - targets: ['localhost:9464']
    scrape_interval: 10s
    metrics_path: '/metrics'

  # The collector's own telemetry (batch processor, receiver/exporter counters, memory)
  - job_name: 'otelcol-internal'
    static_configs:
      - targets: ['localhost:8888']
    scrape_interval: 10s
