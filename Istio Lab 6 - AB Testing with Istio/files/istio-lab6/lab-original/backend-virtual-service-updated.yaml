apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: backend-virtual-service
  namespace: ab-testing
spec:
  hosts:
  - '*'
  gateways:
  - backend-gateway
  http:
  - match:
    - headers:
        user-type:
          exact: beta
    route:
    - destination:
        host: backend-service
        subset: v2
      weight: 100
  - route:
    - destination:
        host: backend-service
        subset: v1
      weight: 70
    - destination:
        host: backend-service
        subset: v2
      weight: 30
