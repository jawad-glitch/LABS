---
apiVersion: v1
kind: ServiceAccount
metadata: {name: flux-production, namespace: flux-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: flux-production-deployer, namespace: production}
rules:
- {apiGroups: [""], resources: ["configmaps", "services", "secrets", "serviceaccounts", "pods"], verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]}
- {apiGroups: ["apps"], resources: ["deployments", "replicasets", "statefulsets"], verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]}
- {apiGroups: ["networking.k8s.io"], resources: ["ingresses"], verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]}
- {apiGroups: ["helm.toolkit.fluxcd.io"], resources: ["helmreleases"], verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]}
- {apiGroups: ["source.toolkit.fluxcd.io"], resources: ["helmrepositories", "ocirepositories"], verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: flux-production-deployer, namespace: production}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: flux-production-deployer}
subjects: [{kind: ServiceAccount, name: flux-production, namespace: flux-system}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: flux-staging, namespace: flux-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: flux-staging-deployer, namespace: staging}
rules:
- {apiGroups: [""], resources: ["configmaps", "services", "secrets", "serviceaccounts", "pods"], verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]}
- {apiGroups: ["apps"], resources: ["deployments", "replicasets", "statefulsets"], verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]}
- {apiGroups: ["networking.k8s.io"], resources: ["ingresses"], verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]}
- {apiGroups: ["helm.toolkit.fluxcd.io"], resources: ["helmreleases"], verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]}
- {apiGroups: ["source.toolkit.fluxcd.io"], resources: ["helmrepositories", "ocirepositories"], verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: flux-staging-deployer, namespace: staging}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: flux-staging-deployer}
subjects: [{kind: ServiceAccount, name: flux-staging, namespace: flux-system}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: flux-readonly, namespace: flux-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: flux-readonly-view}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects: [{kind: ServiceAccount, name: flux-readonly, namespace: flux-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: flux-readonly-crds}
rules:
- {apiGroups: ["source.toolkit.fluxcd.io", "kustomize.toolkit.fluxcd.io", "helm.toolkit.fluxcd.io"], resources: ["*"], verbs: ["get", "list", "watch"]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: flux-readonly-crds}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: flux-readonly-crds}
subjects: [{kind: ServiceAccount, name: flux-readonly, namespace: flux-system}]
