apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-app
  namespace: stage
  labels: {app: gitops-app, environment: stage}
spec:
  replicas: 2
  selector:
    matchLabels: {app: gitops-app}
  template:
    metadata:
      labels: {app: gitops-app, environment: stage}
    spec:
      containers:
      - name: app
        image: nginx:1.27-alpine
        ports: [{containerPort: 80}]
        env: [{name: ENVIRONMENT, value: "staging"}]
        resources: {requests: {memory: "128Mi", cpu: "100m"}, limits: {memory: "256Mi", cpu: "200m"}}
---
apiVersion: v1
kind: Service
metadata: {name: gitops-app-service, namespace: stage}
spec:
  selector: {app: gitops-app}
  ports: [{port: 80, targetPort: 80}]
  type: ClusterIP
---
apiVersion: v1
kind: Namespace
metadata: {name: stage}
