# [lab-runtime] network= stripped (CLI-only), miner-* stripped (conflicts with --network=dev), data-path made absolute ($HOME expanded)
# Besu Configuration File with Prometheus Metrics

data-path="/home/ubuntu/besu-node/data"

rpc-http-enabled=true
rpc-http-host="0.0.0.0"
rpc-http-port=8545
rpc-http-cors-origins=["*"]

metrics-enabled=true
metrics-protocol="prometheus"
metrics-host="0.0.0.0"
metrics-port=9545

logging="INFO"

