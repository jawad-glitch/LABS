apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cross-cluster-policy
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app: web-app
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: web-app
      matchExpressions:
      - {key: io.cilium.k8s.policy.cluster, operator: In, values: [cluster1, cluster2]}
  - fromEndpoints:
    - matchLabels:
        app: test-client
      matchExpressions:
      - {key: io.cilium.k8s.policy.cluster, operator: In, values: [cluster1, cluster2]}
    toPorts:
    - ports:
      - {port: "80", protocol: TCP}
