apiVersion: apps/v1
kind: Deployment
metadata: {name: webapp}
spec:
  replicas: 3
  template:
    spec:
      containers:
      - name: webapp
        env: [{name: ENVIRONMENT, value: "production"}, {name: DEBUG, value: "false"}]
        resources: {requests: {memory: "128Mi", cpu: "500m"}, limits: {memory: "256Mi", cpu: "1000m"}}
        livenessProbe: {httpGet: {path: /health, port: 80}, initialDelaySeconds: 30, periodSeconds: 10}
        readinessProbe: {httpGet: {path: /ready, port: 80}, initialDelaySeconds: 5, periodSeconds: 5}
