apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata: {name: k8sallowedrepos}
spec:
  crd:
    spec:
      names: {kind: K8sAllowedRepos}
      validation:
        openAPIV3Schema:
          type: object
          properties:
            repos: {type: array, items: {type: string}}
  targets:
  - target: admission.k8s.gatekeeper.sh
    rego: |
      package k8sallowedrepos

      input_containers[c] { c := input.review.object.spec.containers[_] }
      input_containers[c] { c := input.review.object.spec.initContainers[_] }

      repo_allowed(image) {
        repo := input.parameters.repos[_]
        startswith(image, repo)
      }

      violation[{"msg": msg}] {
        c := input_containers[_]
        not repo_allowed(c.image)
        msg := sprintf("container <%v> has image <%v>, allowed repos are %v", [c.name, c.image, input.parameters.repos])
      }
