apiVersion: v1
kind: Service
metadata:
  name: rollout-canary-stable
  namespace: canary-demo
spec:
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: advanced-rollout-canary
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: rollout-canary-canary
  namespace: canary-demo
spec:
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: advanced-rollout-canary
  type: ClusterIP
