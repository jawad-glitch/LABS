apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: default
spec:
  args:
  - name: service-name
  metrics:
  - name: success-rate
    interval: 30s
    count: 3
    successCondition: result[0] >= 0.95
    failureLimit: 3
    provider:
      prometheus:
        address: http://prometheus-service.prometheus.svc.cluster.local:9090
        query: |
          sum(rate(http_requests_total{job="{{args.service-name}}",status=~"2.."}[2m])) /
          sum(rate(http_requests_total{job="{{args.service-name}}"}[2m]))
  - name: avg-response-time
    interval: 30s
    count: 3
    successCondition: result[0] <= 0.5
    failureLimit: 3
    provider:
      prometheus:
        address: http://prometheus-service.prometheus.svc.cluster.local:9090
        query: |
          histogram_quantile(0.95,
            sum(rate(response_time_seconds_bucket{job="{{args.service-name}}"}[2m])) by (le)
          )
