node:
  id: reviews.bookinfo~sidecar
  cluster: reviews.bookinfo
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 15000
static_resources:
  listeners:
  - name: 0.0.0.0_9080
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 9080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: reviews.bookinfo
          generate_request_id: true
          tracing:
            random_sampling:
              value: 100
            provider:
              name: envoy.tracers.zipkin
              typed_config:
                '@type': type.googleapis.com/envoy.config.trace.v3.ZipkinConfig
                collector_cluster: zipkin
                collector_endpoint: /api/v2/spans
                collector_endpoint_version: HTTP_JSON
                shared_span_context: false
          route_config:
            name: reviews.bookinfo
            virtual_hosts:
            - name: reviews.bookinfo
              domains:
              - '*'
              routes:
              - match:
                  prefix: /
                route:
                  cluster: app
                  timeout: 15s
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: zipkin
    type: STRICT_DNS
    connect_timeout: 2s
    lb_policy: ROUND_ROBIN
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: zipkin
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: jaeger
                port_value: 9411
  - name: app
    type: STRICT_DNS
    connect_timeout: 2s
    lb_policy: ROUND_ROBIN
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: app
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: pod-reviews-v1
                port_value: 9080
        - endpoint:
            address:
              socket_address:
                address: pod-reviews-v2
                port_value: 9080
        - endpoint:
            address:
              socket_address:
                address: pod-reviews-v3
                port_value: 9080

