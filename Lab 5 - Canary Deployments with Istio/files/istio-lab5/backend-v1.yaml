apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v1
  namespace: canary-demo
  labels:
    app: backend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
      version: v1
  template:
    metadata:
      labels:
        app: backend
        version: v1
    spec:
      containers:
      - name: backend
        image: nginx:1.27-alpine
        command: ["/bin/sh", "-c"]
        args:
        - echo '<div class="container"><h1>Backend Service</h1><p class="version">Version 1.0 (Stable)</p></div>' > /usr/share/nginx/html/index.html && nginx -g "daemon off;"
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-v1-html
  namespace: canary-demo
data:
  index.html: "Version 1.0 (Stable)"
