apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: l7-policy-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
    spec:
      containers:
      - name: httpbin
        image: python:3.9-alpine
        command: ["python3", "-c"]
        args:
        - |
          import http.server, socketserver
          class Handler(http.server.SimpleHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{"url": "http://httpbin-service' + self.path.encode() + b'"}')
              def do_POST(self):
                  self.send_response(200)
                  self.send_header('Content-type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{"data": "posted"}')
          socketserver.TCPServer(("", 80), Handler).serve_forever()
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin-service
  namespace: l7-policy-demo
spec:
  selector:
    app: httpbin
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
