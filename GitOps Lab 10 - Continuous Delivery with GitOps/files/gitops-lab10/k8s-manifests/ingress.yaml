apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: gitops-demo-ingress, namespace: default}
spec:
  ingressClassName: nginx
  rules:
  - host: gitops-demo.local
    http:
      paths:
      - {path: /, pathType: Prefix, backend: {service: {name: gitops-demo-service, port: {number: 80}}}}
