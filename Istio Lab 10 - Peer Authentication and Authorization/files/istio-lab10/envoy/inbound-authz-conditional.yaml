admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 15000
static_resources:
  listeners:
  - name: virtualInbound
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 9080
    listener_filters:
    - name: envoy.filters.listener.tls_inspector
      typed_config:
        '@type': type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
    filter_chains:
    - filter_chain_match:
        transport_protocol: tls
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          require_client_certificate: true
          common_tls_context:
            tls_certificates:
            - certificate_chain:
                filename: /pki/bookinfo-details.crt
              private_key:
                filename: /pki/bookinfo-details.key
            validation_context:
              trusted_ca:
                filename: /pki/ca.crt
            alpn_protocols:
            - h2
            - http/1.1
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: inbound_0.0.0.0_9080_mtls
          forward_client_cert_details: SANITIZE_SET
          set_current_client_cert_details:
            uri: true
          route_config:
            name: inbound_0.0.0.0_9080_mtls
            virtual_hosts:
            - name: all
              domains:
              - '*'
              routes:
              - match:
                  prefix: /
                route:
                  cluster: inbound|9080||
          http_filters:
          - name: envoy.filters.http.rbac
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
              rules:
                action: ALLOW
                policies:
                  rule[0]:
                    permissions:
                    - or_rules:
                        rules:
                        - header:
                            name: :method
                            string_match:
                              exact: GET
                    principals:
                    - or_ids:
                        ids:
                        - authenticated:
                            principal_name:
                              exact: spiffe://cluster.local/ns/default/sa/bookinfo-productpage
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: inbound|9080||
    type: STATIC
    connect_timeout: 2s
    load_assignment:
      cluster_name: inbound|9080||
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 80

