apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: productpage-netpol
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app: productpage
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: istio-system
        k8s:app: istio-ingressgateway
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: default
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: ANY
      rules:
        dns:
        - matchPattern: "*"
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: istio-system
        k8s:app: istiod
    toPorts:
    - ports:
      - port: "15012"
        protocol: TCP
  - toEndpoints:
    - matchExpressions:
      - key: app
        operator: In
        values: [details, reviews, ratings]
    toPorts:
    - ports:
      - port: "9080"
        protocol: TCP
  - toServices:
    - k8sService:
        serviceName: kubernetes
        namespace: default
