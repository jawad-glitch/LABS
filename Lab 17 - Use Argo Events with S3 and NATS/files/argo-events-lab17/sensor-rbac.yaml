apiVersion: v1
kind: ServiceAccount
metadata:
  name: operate-workflow-sa
  namespace: argo-events
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: operate-workflow-role
  namespace: argo-events
rules:
- apiGroups: [argoproj.io]
  resources: [workflows, workflowtemplates]
  verbs: [create, get, list, watch, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: operate-workflow-role-binding
  namespace: argo-events
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: operate-workflow-role}
subjects: [{kind: ServiceAccount, name: operate-workflow-sa, namespace: argo-events}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workflow-executor
  namespace: argo-events
rules:
- apiGroups: [argoproj.io]
  resources: [workflowtaskresults]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workflow-executor-default
  namespace: argo-events
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: workflow-executor}
subjects: [{kind: ServiceAccount, name: default, namespace: argo-events}]
