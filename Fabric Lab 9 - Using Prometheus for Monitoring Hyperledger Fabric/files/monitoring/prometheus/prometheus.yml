global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/fabric-alerts.yml
scrape_configs:
  - job_name: fabric-peer-org1
    static_configs: [{targets: ['host.docker.internal:9443']}]
  - job_name: fabric-peer-org2
    static_configs: [{targets: ['host.docker.internal:9444']}]
  - job_name: fabric-orderer
    static_configs: [{targets: ['host.docker.internal:9445']}]
