global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: counter-app
    static_configs:
      - targets: ['localhost:8001']

  - job_name: gauge-app
    static_configs:
      - targets: ['localhost:8002']

  - job_name: histogram-app
    static_configs:
      - targets: ['localhost:8003', 'localhost:8013']

  - job_name: summary-app
    static_configs:
      - targets: ['localhost:8004', 'localhost:8014']
