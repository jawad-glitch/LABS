apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: {name: generate-default-deny}
spec:
  generateExisting: true
  rules:
  - name: default-deny-all
    match:
      any:
      - resources:
          kinds: ["Namespace"]
          selector: {matchLabels: {security.aiops/tier: restricted}}
    generate:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      name: default-deny-all
      namespace: "{{request.object.metadata.name}}"
      synchronize: true
      data:
        spec:
          podSelector: {}
          policyTypes: ["Ingress", "Egress"]
