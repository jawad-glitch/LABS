apiVersion: apps/v1
kind: Deployment
metadata: {name: webapp}
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: webapp
        env: [{name: ENVIRONMENT, value: "development"}, {name: DEBUG, value: "true"}]
        resources: {requests: {memory: "32Mi", cpu: "100m"}, limits: {memory: "64Mi", cpu: "200m"}}
