---
- name: Install nginx and redis client tools
  ansible.builtin.apt:
    name: [nginx, redis-tools]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create web root
  ansible.builtin.file:
    path: "{{ web_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Deploy index page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ web_root }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"

- name: Deploy application environment file (contains secret)
  ansible.builtin.template:
    src: lab-app.env.j2
    dest: /etc/lab-app.env
    owner: root
    group: www-data
    mode: "0640"
  no_log: true

- name: Deploy nginx site configuration
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/lab.conf
    mode: "0644"
  notify: nginx config changed

- name: Enable lab site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/lab.conf
    dest: /etc/nginx/sites-enabled/lab.conf
    state: link
  notify: nginx config changed

- name: Disable default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: nginx config changed

- name: Ensure nginx is running
  ansible.builtin.service:
    name: nginx
    state: started

