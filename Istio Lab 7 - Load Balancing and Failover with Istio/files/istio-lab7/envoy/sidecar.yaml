admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 15000
static_resources:
  listeners:
  - name: outbound_9080
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 9080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: outbound_0.0.0.0_9080
          route_config:
            name: '9080'
            virtual_hosts:
            - name: details
              domains:
              - '*'
              routes:
              - match:
                  prefix: /
                route:
                  cluster: outbound|9080|v1|details.lab7-loadbalancing.svc.cluster.local
                  timeout: 10s
                  retry_policy:
                    retry_on: connect-failure,refused-stream,unavailable,cancelled,retriable-status-codes
                    num_retries: 2
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: outbound|9080|v1|details.lab7-loadbalancing.svc.cluster.local
    type: STATIC
    connect_timeout: 1s
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: outbound|9080|v1|details.lab7-loadbalancing.svc.cluster.local
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 172.18.0.2
                port_value: 9080
        - endpoint:
            address:
              socket_address:
                address: 172.18.0.3
                port_value: 9080
        - endpoint:
            address:
              socket_address:
                address: 172.18.0.4
                port_value: 9080

