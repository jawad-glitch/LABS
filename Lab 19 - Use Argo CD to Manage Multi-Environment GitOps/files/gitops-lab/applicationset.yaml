apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sample-app-environments
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      elements:
      - {env: dev}
      - {env: staging}
      - {env: prod}
  template:
    metadata:
      name: 'sample-app-{{.env}}'
    spec:
      project: default
      source:
        repoURL: 'https://github.com/jawad-glitch/sample-app-{{.env}}.git'
        targetRevision: HEAD
        path: manifests
      destination:
        server: https://kubernetes.default.svc
        namespace: 'sample-app-{{.env}}'
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
  templatePatch: |
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: {{ eq .env "dev" }}
