apiVersion: v1
data:
  app.properties: |
    app.name=webapp
    app.version=1.0.0-dev
    log.level=DEBUG
    debug.enabled=true
  nginx.conf: |
    server { listen 80; server_name localhost; location / { root /usr/share/nginx/html; index index.html index.htm; } }
kind: ConfigMap
metadata:
  annotations:
    kustomize.config.k8s.io/managed: "true"
  labels:
    environment: development
    managed-by: kustomize
    project: kustomize-lab
    tier: dev
  name: ConfigMap-webapp-config
  namespace: development
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kustomize.config.k8s.io/managed: "true"
  labels:
    app: database
    environment: development
    managed-by: kustomize
    project: kustomize-lab
    tier: dev
  name: ConfigMap-database-service
  namespace: development
spec:
  ports:
  - port: 5432
    protocol: TCP
    targetPort: 5432
  selector:
    app: database
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kustomize.config.k8s.io/managed: "true"
  labels:
    app: webapp
    environment: development
    managed-by: kustomize
    project: kustomize-lab
    tier: dev
  name: ConfigMap-webapp-service
  namespace: development
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: webapp
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kustomize.config.k8s.io/managed: "true"
  labels:
    app: database
    environment: development
    managed-by: kustomize
    project: kustomize-lab
    tier: dev
  name: ConfigMap-database
  namespace: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      annotations:
        kustomize.config.k8s.io/managed: "true"
      labels:
        app: database
        environment: development
        managed-by: kustomize
        project: kustomize-lab
        tier: dev
    spec:
      containers:
      - env:
        - name: POSTGRES_PASSWORD
          value: devpass123
        - name: POSTGRES_DB
          value: appdb
        - name: POSTGRES_USER
          value: appuser
        image: postgres:17-alpine
        name: database
        ports:
        - containerPort: 5432
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kustomize.config.k8s.io/managed: "true"
  labels:
    app: webapp
    environment: development
    managed-by: kustomize
    project: kustomize-lab
    tier: dev
  name: ConfigMap-webapp
  namespace: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      annotations:
        kustomize.config.k8s.io/managed: "true"
      labels:
        app: webapp
        environment: development
        managed-by: kustomize
        project: kustomize-lab
        tier: dev
    spec:
      containers:
      - env:
        - name: ENVIRONMENT
          value: development
        - name: DEBUG
          value: "true"
        image: nginx:1.27-alpine
        name: webapp
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 200m
            memory: 64Mi
          requests:
            cpu: 100m
            memory: 32Mi
