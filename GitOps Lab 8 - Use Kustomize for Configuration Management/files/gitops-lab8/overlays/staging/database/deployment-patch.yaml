apiVersion: apps/v1
kind: Deployment
metadata: {name: database}
spec:
  template:
    spec:
      containers:
      - name: database
        env: [{name: POSTGRES_PASSWORD, value: "stagingpass456"}]
        resources: {requests: {memory: "256Mi", cpu: "200m"}, limits: {memory: "512Mi", cpu: "400m"}}
