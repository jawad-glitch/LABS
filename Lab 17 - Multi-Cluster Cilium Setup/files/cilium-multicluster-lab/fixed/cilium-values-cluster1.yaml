cluster:
  name: cluster1
  id: 1
ipam:
  mode: kubernetes
kubeProxyReplacement: true
k8sServiceHost: cluster1-control-plane
k8sServicePort: 6443
routingMode: tunnel
tunnelProtocol: vxlan
operator:
  replicas: 1
clustermesh:
  useAPIServer: true
  apiserver:
    service:
      type: NodePort
hubble:
  relay:
    enabled: true
