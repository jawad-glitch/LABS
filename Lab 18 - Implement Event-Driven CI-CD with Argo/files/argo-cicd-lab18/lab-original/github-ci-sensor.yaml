spec:
  dependencies: [{name: github-dep, eventSourceName: github-event-source, eventName: example}]
  triggers:
  - template:
      name: github-workflow-trigger
      argoWorkflow:
        source: {resource: {spec: {arguments: {parameters: [{name: repo-url, value: "https://github.com/your-username/your-repo.git"}, {name: branch, value: main}]}}}}
        parameters:
        - src: {dependencyName: github-dep, dataKey: body.ref}
          dest: spec.arguments.parameters.0.value
