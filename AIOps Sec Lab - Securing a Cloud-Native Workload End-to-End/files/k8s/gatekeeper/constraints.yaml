apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredNonRoot
metadata: {name: shop-pod-security}
spec:
  enforcementAction: deny
  match: {kinds: [{apiGroups: [""], kinds: ["Pod"]}], namespaces: ["shop"]}
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedRepos
metadata: {name: shop-allowed-repos}
spec:
  enforcementAction: deny
  match: {kinds: [{apiGroups: [""], kinds: ["Pod"]}], namespaces: ["shop"]}
  parameters: {repos: ["shop/", "hashicorp/vault:", "curlimages/curl:"]}
