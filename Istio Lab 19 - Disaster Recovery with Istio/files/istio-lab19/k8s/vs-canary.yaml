apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: bookstore-vs
  namespace: disaster-recovery
spec:
  hosts:
  - '*'
  gateways:
  - bookstore-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: bookstore-service
        subset: v1
      weight: 90
    - destination:
        host: bookstore-service
        subset: v2
      weight: 10
