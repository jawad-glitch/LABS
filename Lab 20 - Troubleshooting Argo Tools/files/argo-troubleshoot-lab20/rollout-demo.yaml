apiVersion: v1
kind: Namespace
metadata: {name: rollout-demo}
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata: {name: rollout-demo, namespace: rollout-demo}
spec:
  replicas: 5
  strategy:
    canary:
      canaryService: rollout-demo-canary
      stableService: rollout-demo-stable
      steps:
      - setWeight: 20
      - pause: {duration: 30s}
      - setWeight: 40
      - pause: {duration: 30s}
      - setWeight: 60
      - pause: {duration: 30s}
      - setWeight: 80
      - pause: {duration: 30s}
      analysis:
        templates:
        - templateName: http-check
        startingStep: 2
        args:
        - {name: service-name, value: rollout-demo-canary}
  selector:
    matchLabels: {app: rollout-demo}
  template:
    metadata:
      labels: {app: rollout-demo}
    spec:
      containers:
      - name: rollout-demo
        image: nginx:1.26-alpine
        ports:
        - {name: http, containerPort: 80, protocol: TCP}
        resources:
          requests: {memory: 32Mi, cpu: 5m}
---
apiVersion: v1
kind: Service
metadata: {name: rollout-demo-stable, namespace: rollout-demo, labels: {app: rollout-demo}}
spec:
  ports: [{port: 80, targetPort: http, protocol: TCP, name: http}]
  selector: {app: rollout-demo}
---
apiVersion: v1
kind: Service
metadata: {name: rollout-demo-canary, namespace: rollout-demo, labels: {app: rollout-demo}}
spec:
  ports: [{port: 80, targetPort: http, protocol: TCP, name: http}]
  selector: {app: rollout-demo}
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata: {name: http-check, namespace: rollout-demo}
spec:
  args: [{name: service-name}]
  metrics:
  - name: http-check
    interval: 10s
    count: 3
    failureLimit: 1
    provider:
      job:
        spec:
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
              - name: check
                image: curlimages/curl:7.85.0
                command: [/bin/sh, -c]
                args: ["for i in $(seq 1 10); do curl -sf -o /dev/null http://{{args.service-name}}.rollout-demo.svc.cluster.local/ || exit 1; done; echo ok"]
