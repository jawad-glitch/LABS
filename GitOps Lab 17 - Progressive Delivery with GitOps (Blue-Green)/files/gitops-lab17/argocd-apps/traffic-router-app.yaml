apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traffic-router
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    path: traffic-router
    repoURL: http://172.17.0.1:8771/gitops-blue-green.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
