# OpenTelemetry Collector Configuration
# Lab 9: Collector Pipelines & Processors

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  # OTLP receiver for accepting telemetry data
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Memory limiter to prevent OOM issues (must be first in each pipeline)
  memory_limiter:
    limit_mib: 256
    spike_limit_mib: 64
    check_interval: 5s

  # Batch processor for efficient data handling (last before exporters)
  batch:
    send_batch_size: 512
    timeout: 2s
    send_batch_max_size: 1024

  # Attributes processor to add custom tags
  attributes:
    actions:
      - key: service.environment
        value: dev
        action: insert
      - key: lab.name
        value: "collector-pipelines"
        action: insert
      - key: lab.number
        value: 9
        action: insert
      - key: processed.timestamp
        value: "2024-01-01T00:00:00Z"
        action: insert
      - key: pipeline.version
        value: "v1.0"
        action: insert
exporters:
  # Debug exporter (replaces the removed 'logging' exporter)
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200

  # File exporter - written to the mounted ./data directory
  file:
    path: /tmp/data/otel-data.json
    rotation:
      max_megabytes: 10
      max_days: 3
      max_backups: 3

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes, batch]
      exporters: [debug, file]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes, batch]
      exporters: [debug, file]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes, batch]
      exporters: [debug, file]
