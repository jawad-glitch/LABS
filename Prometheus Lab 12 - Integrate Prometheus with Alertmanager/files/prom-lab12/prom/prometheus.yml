global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/rules/*.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager.monitoring.svc.cluster.local:9093']   # what the Operator renders from spec.alerting
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]
  - job_name: node-exporter
    static_configs: [{targets: ['host.docker.internal:9100']}]
  - job_name: alertmanager
    static_configs: [{targets: ['alertmanager.monitoring.svc.cluster.local:9093']}]
