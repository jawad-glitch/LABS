apiVersion: v1
kind: ServiceAccount
metadata: {name: flux-production, namespace: flux-system}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: flux-staging, namespace: flux-system}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: flux-readonly, namespace: flux-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: flux-production-role}
rules:
- {apiGroups: [""], resources: ["*"], verbs: ["*"]}
- {apiGroups: ["apps"], resources: ["*"], verbs: ["*"]}
- {apiGroups: ["networking.k8s.io"], resources: ["*"], verbs: ["*"]}
- {apiGroups: ["source.toolkit.fluxcd.io"], resources: ["*"], verbs: ["*"]}
- {apiGroups: ["kustomize.toolkit.fluxcd.io"], resources: ["*"], verbs: ["*"]}
- {apiGroups: ["helm.toolkit.fluxcd.io"], resources: ["*"], verbs: ["*"]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: flux-staging-role}
rules:
- {apiGroups: [""], resources: ["pods", "services", "configmaps", "secrets"], verbs: ["get", "list", "create", "update", "patch", "delete"]}
- {apiGroups: ["apps"], resources: ["deployments", "replicasets"], verbs: ["get", "list", "create", "update", "patch", "delete"]}
- {apiGroups: ["source.toolkit.fluxcd.io"], resources: ["gitrepositories", "helmrepositories"], verbs: ["get", "list", "create", "update", "patch"]}
- {apiGroups: ["kustomize.toolkit.fluxcd.io"], resources: ["kustomizations"], verbs: ["get", "list", "create", "update", "patch"]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: flux-readonly-role}
rules:
- {apiGroups: [""], resources: ["*"], verbs: ["get", "list", "watch"]}
- {apiGroups: ["apps"], resources: ["*"], verbs: ["get", "list", "watch"]}
- {apiGroups: ["source.toolkit.fluxcd.io", "kustomize.toolkit.fluxcd.io", "helm.toolkit.fluxcd.io"], resources: ["*"], verbs: ["get", "list", "watch"]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: flux-production-binding}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: flux-production-role}
subjects: [{kind: ServiceAccount, name: flux-production, namespace: flux-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: flux-staging-binding}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: flux-staging-role}
subjects: [{kind: ServiceAccount, name: flux-staging, namespace: flux-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: flux-readonly-binding}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: flux-readonly-role}
subjects: [{kind: ServiceAccount, name: flux-readonly, namespace: flux-system}]
