apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: temp-test-access
  namespace: identity-lab
spec:
  endpointSelector:
    matchLabels:
      tier: backend
  ingress:
  - fromEndpoints:
    - matchLabels:
        tier: test
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
