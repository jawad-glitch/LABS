apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8scontainerlimits
spec:
  crd:
    spec:
      names:
        kind: K8sContainerLimits
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8scontainerlimits

        pod_containers[c] { c := input.review.object.spec.containers[_] }
        pod_containers[c] { c := input.review.object.spec.initContainers[_] }
        pod_containers[c] { c := input.review.object.spec.template.spec.containers[_] }
        pod_containers[c] { c := input.review.object.spec.template.spec.initContainers[_] }

        violation[{"msg": msg}] {
          c := pod_containers[_]
          not c.resources.limits.cpu
          msg := sprintf("Container %v must have CPU limits defined", [c.name])
        }

        violation[{"msg": msg}] {
          c := pod_containers[_]
          not c.resources.limits.memory
          msg := sprintf("Container %v must have memory limits defined", [c.name])
        }
