apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata: {name: production-apps, namespace: flux-system}
spec:
  interval: 10m
  serviceAccountName: flux-production
  sourceRef: {kind: GitRepository, name: production-repo}
  path: "./deploy"
  prune: true
  wait: true
  timeout: 5m
