General:
  ListenAddress: 0.0.0.0
  ListenPort: 7050
  TLS:
    Enabled: false
    PrivateKey: tls/server.key
    Certificate: tls/server.crt
    RootCAs:
    - tls/ca.crt
    ClientAuthRequired: false
    ClientRootCAs: null
  Keepalive:
    ServerMinInterval: 60s
    ServerInterval: 7200s
    ServerTimeout: 20s
  MaxRecvMsgSize: 104857600
  MaxSendMsgSize: 104857600
  Cluster:
    ListenAddress: 0.0.0.0
    ListenPort: 7055
    ServerCertificate: /var/hyperledger/orderer/tls/server.crt
    ServerPrivateKey: /var/hyperledger/orderer/tls/server.key
    ClientCertificate: /var/hyperledger/orderer/tls/server.crt
    ClientPrivateKey: /var/hyperledger/orderer/tls/server.key
    RootCAs:
    - /var/hyperledger/orderer/tls/ca.crt
  BootstrapMethod: none
  BootstrapFile: null
  LocalMSPDir: /var/hyperledger/orderer/msp
  LocalMSPID: OrdererMSP
  Profile:
    Enabled: false
    Address: 0.0.0.0:6060
  BCCSP:
    Default: SW
    SW:
      Hash: SHA2
      Security: 256
      FileKeyStore:
        KeyStore: null
    PKCS11:
      Library: null
      Label: null
      Pin: null
      Hash: null
      Security: null
      FileKeyStore:
        KeyStore: null
  Authentication:
    TimeWindow: 15m
FileLedger:
  Location: /var/hyperledger/production/orderer
Kafka:
  Retry:
    ShortInterval: 5s
    ShortTotal: 10m
    LongInterval: 5m
    LongTotal: 12h
    NetworkTimeouts:
      DialTimeout: 10s
      ReadTimeout: 10s
      WriteTimeout: 10s
    Metadata:
      RetryBackoff: 250ms
      RetryMax: 3
    Producer:
      RetryBackoff: 100ms
      RetryMax: 3
    Consumer:
      RetryBackoff: 2s
  Topic:
    ReplicationFactor: 3
  Verbose: false
  TLS:
    Enabled: false
    PrivateKey: null
    Certificate: null
    RootCAs: null
  SASLPlain:
    Enabled: false
    User: null
    Password: null
  Version: null
Debug:
  BroadcastTraceDir: null
  DeliverTraceDir: null
Operations:
  ListenAddress: 127.0.0.1:8443
  TLS:
    Enabled: false
    Certificate: null
    PrivateKey: null
    ClientAuthRequired: false
    ClientRootCAs: []
Metrics:
  Provider: disabled
  Statsd:
    Network: udp
    Address: 127.0.0.1:8125
    WriteInterval: 30s
    Prefix: null
Admin:
  ListenAddress: 0.0.0.0:7053
  TLS:
    Enabled: false
    Certificate: null
    PrivateKey: null
    ClientAuthRequired: true
    ClientRootCAs: []
ChannelParticipation:
  Enabled: true
  MaxRequestBodySize: 1 MB
Consensus:
  WALDir: /var/hyperledger/production/orderer/etcdraft/wal
  SnapDir: /var/hyperledger/production/orderer/etcdraft/snapshot
