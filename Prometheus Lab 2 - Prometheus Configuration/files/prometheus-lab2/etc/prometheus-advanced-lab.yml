global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'prometheus-lab'

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['localhost:9100']
    metrics_path: /metrics
    scheme: http

  - job_name: 'custom-app-fast'
    scrape_interval: 5s
    scrape_timeout: 3s
    static_configs:
      - targets: ['localhost:8080']
    metrics_path: /metrics
    scheme: http

  - job_name: 'custom-app-slow'
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: ['localhost:8081']
    metrics_path: /health/metrics
    scheme: http

  - job_name: 'authenticated-service'
    scrape_interval: 30s
    basic_auth:
      username: 'monitoring'
      password: 'secret123'
    static_configs:
      - targets: ['localhost:8082']

  - job_name: 'file-discovery'
    scrape_interval: 30s
    file_sd_configs:
      - files:
        - '/etc/prometheus/targets/*.yml'
        refresh_interval: 60s

  - job_name: 'labeled-service'
    scrape_interval: 20s
    static_configs:
      - targets: ['localhost:8083']
        labels:
          environment: 'production'
          team: 'backend'
          service: 'api'
