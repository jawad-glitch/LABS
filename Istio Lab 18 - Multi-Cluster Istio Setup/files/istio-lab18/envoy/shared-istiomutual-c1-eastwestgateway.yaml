admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 15000
static_resources:
  listeners:
  - name: 0.0.0.0_15443
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 15443
    filter_chains:
    - transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          require_client_certificate: true
          common_tls_context:
            tls_certificates:
            - certificate_chain:
                filename: /pki/ewgw-c1.crt
              private_key:
                filename: /pki/ewgw-c1.key
            validation_context:
              trusted_ca:
                filename: /pki/root-ca.crt
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ew_terminate
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            name: ew_terminate
            virtual_hosts:
            - name: all
              domains:
              - '*'
              routes: []
  clusters: []

