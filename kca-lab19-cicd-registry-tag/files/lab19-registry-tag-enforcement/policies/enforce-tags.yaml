apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: enforce-tags
  annotations:
    policies.kyverno.io/title: Enforce Image Tags
    policies.kyverno.io/category: Security
    policies.kyverno.io/description: >-
      This policy prevents the use of 'latest' or missing tags and enforces semantic versioning.
spec:
  background: true
  rules:
  - name: require-image-tag
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      failureAction: Enforce
      message: "Container images must have specific tags (not 'latest' or empty)"
      pattern:
        spec:
          containers:
          - name: "*"
            image: "?*:?* & !*:latest"
  - name: enforce-semantic-versioning
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      failureAction: Enforce
      message: "Container images should use semantic versioning (e.g., v1.2.3)"
      foreach:
      - list: "request.object.spec.containers"
        deny:
          conditions:
            any:
            - key: "{{ regex_match('^.+:v?[0-9]+\\.[0-9]+\\.[0-9]+.*$', '{{ element.image }}') }}"
              operator: Equals
              value: false
