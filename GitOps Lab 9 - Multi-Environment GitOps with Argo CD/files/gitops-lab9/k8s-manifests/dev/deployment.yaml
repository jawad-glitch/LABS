apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-app
  namespace: dev
  labels: {app: gitops-app, environment: dev}
spec:
  replicas: 2
  selector:
    matchLabels: {app: gitops-app}
  template:
    metadata:
      labels: {app: gitops-app, environment: dev}
    spec:
      containers:
      - name: app
        image: nginx:nonexistent-tag
        ports: [{containerPort: 80}]
        env: [{name: ENVIRONMENT, value: "development"}]
        resources: {requests: {memory: "64Mi", cpu: "50m"}, limits: {memory: "128Mi", cpu: "100m"}}
---
apiVersion: v1
kind: Service
metadata: {name: gitops-app-service, namespace: dev}
spec:
  selector: {app: gitops-app}
  ports: [{port: 80, targetPort: 80}]
  type: ClusterIP
---
apiVersion: v1
kind: Namespace
metadata: {name: dev}
