apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: hello-frontend
spec:
  host: hello-frontend
  trafficPolicy:
    loadBalancer: {simple: LEAST_REQUEST}
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: hello-backend
spec:
  host: hello-backend
  trafficPolicy:
    loadBalancer: {simple: ROUND_ROBIN}
