apiVersion: v1
kind: ServiceAccount
metadata: {name: backend, namespace: default}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: frontend, namespace: default}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: backend-config, namespace: default}
data:
  index.html: |
    <html><body><h1>Backend Service Response</h1><p>This is a secure backend service protected by mTLS</p></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend-service, namespace: default, labels: {app: backend, version: v1}}
spec:
  replicas: 2
  selector: {matchLabels: {app: backend, version: v1}}
  template:
    metadata: {labels: {app: backend, version: v1}}
    spec:
      serviceAccountName: backend
      containers:
      - name: backend
        image: nginx:1.27-alpine
        ports: [{containerPort: 80}]
        volumeMounts: [{name: config, mountPath: /usr/share/nginx/html}]
      volumes: [{name: config, configMap: {name: backend-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: backend-service, namespace: default, labels: {app: backend}}
spec:
  ports: [{port: 80, name: http}]
  selector: {app: backend}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend-service, namespace: default, labels: {app: frontend, version: v1}}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend, version: v1}}
  template:
    metadata: {labels: {app: frontend, version: v1}}
    spec:
      serviceAccountName: frontend
      containers:
      - {name: frontend, image: "curlimages/curl:8.11.1", command: ["sleep", "infinity"]}
