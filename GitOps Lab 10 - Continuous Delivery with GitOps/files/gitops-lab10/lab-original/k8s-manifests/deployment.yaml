apiVersion: apps/v1
kind: Deployment
metadata: {name: gitops-demo-app, namespace: default, labels: {app: gitops-demo-app}}
spec:
  replicas: 2
  selector: {matchLabels: {app: gitops-demo-app}}
  template:
    metadata: {labels: {app: gitops-demo-app}}
    spec:
      containers:
      - {name: web, image: "nginx:alpine", ports: [{containerPort: 80}], volumeMounts: [{name: html-content, mountPath: /usr/share/nginx/html}]}
      volumes: [{name: html-content, configMap: {name: app-content}}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: app-content, namespace: default}
data:
  index.html: |
    <html><body><h1>Welcome to GitOps Demo Application</h1><p class="version">Version: 1.0.42</p></body></html>
