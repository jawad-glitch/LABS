apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata: {name: backend-destination-rule, namespace: ab-testing}
spec:
  host: backend-service
  subsets:
  - {name: v1, labels: {version: v1}, trafficPolicy: {loadBalancer: {simple: ROUND_ROBIN}}}
  - {name: v2, labels: {version: v2}, trafficPolicy: {loadBalancer: {simple: ROUND_ROBIN}}}
