apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: argo-events
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin123
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: argo-events
  labels: {app: minio}
spec:
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
    spec:
      containers:
      - name: minio
        image: minio/minio:RELEASE.2023-11-20T22-40-07Z
        args: [server, /data, --console-address, ":9001"]
        envFrom:
        - secretRef: {name: minio-creds}
        env:
        - {name: MINIO_NOTIFY_NATS_ENABLE_PRIMARY, value: "on"}
        - {name: MINIO_NOTIFY_NATS_ADDRESS_PRIMARY, value: "nats.argo-events.svc.cluster.local:4222"}
        - {name: MINIO_NOTIFY_NATS_SUBJECT_PRIMARY, value: "s3.file.uploaded"}
        ports:
        - {containerPort: 9000, name: api}
        - {containerPort: 9001, name: console}
        volumeMounts:
        - {name: data, mountPath: /data}
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: argo-events
  labels: {app: minio}
spec:
  selector: {app: minio}
  ports:
  - {name: api, port: 9000, targetPort: 9000}
  - {name: console, port: 9001, targetPort: 9001}
