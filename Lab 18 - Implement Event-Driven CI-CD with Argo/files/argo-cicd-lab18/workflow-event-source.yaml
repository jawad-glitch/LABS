apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata: {name: workflow-event-source, namespace: argo-events}
spec:
  template: {serviceAccountName: ci-eventsource-sa}
  resource:
    example:
      namespace: argo
      group: argoproj.io
      version: v1alpha1
      resource: workflows
      eventTypes: [UPDATE]
      filter:
        labels:
          - {key: workflows.argoproj.io/phase, operation: "==", value: Succeeded}
