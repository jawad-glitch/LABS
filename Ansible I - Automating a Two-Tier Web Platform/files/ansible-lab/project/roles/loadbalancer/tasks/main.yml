---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy load balancer configuration
  ansible.builtin.template:
    src: lb.conf.j2
    dest: /etc/nginx/sites-available/lb.conf
    mode: "0644"
  notify: nginx config changed

- name: Enable load balancer site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/lb.conf
    dest: /etc/nginx/sites-enabled/lb.conf
    state: link
  notify: nginx config changed

- name: Disable default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: nginx config changed

- name: Ensure nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
