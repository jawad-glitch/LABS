apiVersion: v1
kind: Namespace
metadata:
  name: kiali-operator
---
apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali
  namespace: istio-system
spec:
  auth:
    strategy: "anonymous"
  deployment:
    accessible_namespaces:
    - "**"
    image_pull_policy: "IfNotPresent"
    namespace: "istio-system"
  external_services:
    prometheus:
      url: "http://prometheus:9090"
    grafana:
      enabled: true
    tracing:
      enabled: true
  server:
    port: 20001
    web_root: "/kiali"
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: bookinfo-gateway
  namespace: default
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
