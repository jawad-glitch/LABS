apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-rollout
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jawad-glitch/demo-app.git
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: blue-green-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
