apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns-egress, namespace: shop}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {k8s-app: kube-dns}}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: shop-api-flows, namespace: shop}
spec:
  podSelector: {matchLabels: {app: shop-api}}
  policyTypes: ["Ingress", "Egress"]
  ingress:
  - from: [{podSelector: {matchLabels: {access: shop-api}}}]
    ports: [{protocol: TCP, port: 8443}]
  egress:
  - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: vault}}}]
    ports: [{protocol: TCP, port: 8200}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: clients-to-shop-api, namespace: shop}
spec:
  podSelector: {matchLabels: {access: shop-api}}
  policyTypes: ["Egress"]
  egress:
  - to: [{podSelector: {matchLabels: {app: shop-api}}}]
    ports: [{protocol: TCP, port: 8443}]
