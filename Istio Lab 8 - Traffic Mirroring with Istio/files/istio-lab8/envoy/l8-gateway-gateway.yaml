admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 15000
static_resources:
  listeners:
  - name: l8-gateway
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: l8-gateway
          route_config:
            name: l8-gateway
            virtual_hosts:
            - name: productpage
              domains:
              - '*'
              routes:
              - match:
                  path: /productpage
                route: &id001
                  cluster: outbound|9080|v1|productpage.traffic-mirror-demo.svc.cluster.local
                  timeout: 10s
                  request_mirror_policies:
                  - cluster: outbound|9080|v2|productpage.traffic-mirror-demo.svc.cluster.local
                    runtime_fraction:
                      default_value:
                        numerator: 1000000
                        denominator: MILLION
              - match:
                  prefix: /static
                route: *id001
              - match:
                  path: /login
                route: *id001
              - match:
                  path: /logout
                route: *id001
              - match:
                  prefix: /api/v1/products
                route: *id001
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: outbound|9080||productpage.traffic-mirror-demo.svc.cluster.local
    type: STATIC
    connect_timeout: 2s
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: outbound|9080||productpage.traffic-mirror-demo.svc.cluster.local
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 172.18.0.2
                port_value: 15006
        - endpoint:
            address:
              socket_address:
                address: 172.18.0.3
                port_value: 15006
  - name: outbound|9080|v1|productpage.traffic-mirror-demo.svc.cluster.local
    type: STATIC
    connect_timeout: 2s
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: outbound|9080|v1|productpage.traffic-mirror-demo.svc.cluster.local
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 172.18.0.2
                port_value: 15006
  - name: outbound|9080|v2|productpage.traffic-mirror-demo.svc.cluster.local
    type: STATIC
    connect_timeout: 2s
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: outbound|9080|v2|productpage.traffic-mirror-demo.svc.cluster.local
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 172.18.0.3
                port_value: 15006

