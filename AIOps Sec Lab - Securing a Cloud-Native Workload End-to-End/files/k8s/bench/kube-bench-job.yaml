apiVersion: batch/v1
kind: Job
metadata: {name: kube-bench, namespace: default}
spec:
  backoffLimit: 0
  template:
    spec:
      hostPID: true
      restartPolicy: Never
      containers:
      - name: kube-bench
        image: docker.io/aquasec/kube-bench:v0.8.0
        imagePullPolicy: IfNotPresent
        command: ["kube-bench", "run", "--targets", "node,policies", "--benchmark", "BENCH"]
        volumeMounts:
        - {name: var-lib-rancher, mountPath: /var/lib/rancher, readOnly: true}
        - {name: etc-rancher, mountPath: /etc/rancher, readOnly: true}
        - {name: var-lib-kubelet, mountPath: /var/lib/kubelet, readOnly: true}
      volumes:
      - {name: var-lib-rancher, hostPath: {path: /var/lib/rancher}}
      - {name: etc-rancher, hostPath: {path: /etc/rancher}}
      - {name: var-lib-kubelet, hostPath: {path: /var/lib/kubelet}}
