# Besu P2P Networking Configuration

# Network Configuration
network-id=1337
genesis-file="config/genesis.json"

# P2P Configuration
p2p-enabled=true
p2p-host="0.0.0.0"
p2p-port=30303
max-peers=25
remote-connections-limit-enabled=true
remote-connections-max-percentage=60

# Discovery Configuration
discovery-enabled=true
discovery-dns-url=""

# RPC Configuration
rpc-http-enabled=true
rpc-http-host="0.0.0.0"
rpc-http-port=8545
rpc-http-cors-origins=["*"]
rpc-http-api=["ETH","NET","WEB3","DEBUG","ADMIN"]

# WebSocket Configuration
rpc-ws-enabled=true
rpc-ws-host="0.0.0.0"
rpc-ws-port=8546

# Data Storage
data-path="./data"
data-storage-format="BONSAI"

# Logging
logging="INFO"
log-level="INFO"

# Metrics
metrics-enabled=true
metrics-host="0.0.0.0"
metrics-port=9545
