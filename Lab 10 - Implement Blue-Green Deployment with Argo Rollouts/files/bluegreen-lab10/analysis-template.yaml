apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: blue-green-demo
spec:
  args:
  - name: service-name
  metrics:
  - name: success-rate
    interval: 10s
    count: 3
    provider:
      job:
        spec:
          backoffLimit: 1
          template:
            spec:
              restartPolicy: Never
              containers:
              - name: load-tester
                image: curlimages/curl:7.85.0
                command:
                - /bin/sh
                - -c
                - |
                  set -e
                  for i in $(seq 1 10); do
                    response=$(curl -s -o /dev/null -w "%{http_code}" http://{{args.service-name}}.blue-green-demo.svc.cluster.local)
                    if [ "$response" != "200" ]; then
                      echo "Request failed with status: $response"
                      exit 1
                    fi
                    sleep 1
                  done
                  echo "All requests successful"
