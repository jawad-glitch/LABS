apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-nginx-yaml
  namespace: argocd
  labels:
    app: demo-nginx
spec:
  project: default
  source:
    repoURL: https://github.com/jawad-glitch/argocd-demo-app.git
    targetRevision: HEAD
    path: k8s-manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
