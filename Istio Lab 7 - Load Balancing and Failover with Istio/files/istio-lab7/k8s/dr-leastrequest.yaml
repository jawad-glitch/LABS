apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: details
  namespace: lab7-loadbalancing
spec:
  host: details
  subsets:
  - name: v1
    labels:
      version: v1
    trafficPolicy:
      loadBalancer:
        simple: LEAST_REQUEST
      connectionPool:
        tcp:
          maxConnections: 10
        http:
          http1MaxPendingRequests: 10
          maxRequestsPerConnection: 2
