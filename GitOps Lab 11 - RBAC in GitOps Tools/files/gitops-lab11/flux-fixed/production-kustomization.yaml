---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: production-apps
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/production
  prune: true
  serviceAccountName: flux-production
  sourceRef:
    kind: GitRepository
    name: production-repo
  targetNamespace: production
  timeout: 2m0s
  wait: true
