kubeProxyReplacement: true
k8sServiceHost: cilium-mesh-control-plane
k8sServicePort: 6443
routingMode: tunnel
tunnelProtocol: vxlan
ipam:
  mode: kubernetes
operator:
  replicas: 1
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
socketLB:
  hostNamespaceOnly: true
cni:
  exclusive: false
l7Proxy: true
