apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: infrastructure-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
    release: kps
spec:
  groups:
  - name: infrastructure-alerts
    rules:
    - alert: NodeCPUHigh
      expr: 100 - (avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m]))
        * 100) > 75
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: CPU usage above 75%
        description: CPU usage above 75% on {{ $labels.instance }} (value {{ $value
          | printf "%.1f" }})
    - alert: NodeMemoryHigh
      expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100
        > 80
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Memory usage above 80%
        description: Memory usage above 80% on {{ $labels.instance }} (value {{ $value
          | printf "%.1f" }})
    - alert: NodeDiskHigh
      expr: (1 - node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})
        * 100 > 85
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Disk usage above 85%
        description: Disk usage above 85% on {{ $labels.instance }} (value {{ $value
          | printf "%.1f" }})
    - alert: TargetDown
      expr: up == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: Scrape target down
        description: Scrape target down on {{ $labels.instance }} (value {{ $value
          | printf "%.1f" }})
