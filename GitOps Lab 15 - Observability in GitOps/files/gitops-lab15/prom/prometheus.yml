global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/rules/argocd.rules.yml
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]
  - job_name: argocd-application-controller
    static_configs: [{targets: ['172.17.0.1:8082']}]
  - job_name: argocd-server
    static_configs: [{targets: ['172.17.0.1:8083']}]
  - job_name: argocd-repo-server
    static_configs: [{targets: ['172.17.0.1:8084']}]
