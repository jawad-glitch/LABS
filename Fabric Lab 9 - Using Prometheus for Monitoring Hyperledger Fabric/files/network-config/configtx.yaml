Profiles:
  TwoOrgsChannel:
    Policies:
      Readers: &id001
        Type: ImplicitMeta
        Rule: ANY Readers
      Writers: &id002
        Type: ImplicitMeta
        Rule: ANY Writers
      Admins: &id003
        Type: ImplicitMeta
        Rule: MAJORITY Admins
    Capabilities:
      V2_0: true
    Orderer:
      OrdererType: etcdraft
      Addresses:
      - orderer.example.com:7050
      BatchTimeout: 2s
      BatchSize:
        MaxMessageCount: 10
        AbsoluteMaxBytes: 99 MB
        PreferredMaxBytes: 512 KB
      EtcdRaft:
        Consenters:
        - Host: orderer.example.com
          Port: 7055
          ClientTLSCert: /home/ubuntu/fabric-monitoring-lab/fabric-samples/test-network/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
          ServerTLSCert: /home/ubuntu/fabric-monitoring-lab/fabric-samples/test-network/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
      Organizations:
      - Name: OrdererOrg
        ID: OrdererMSP
        MSPDir: /home/ubuntu/fabric-monitoring-lab/fabric-samples/test-network/organizations/ordererOrganizations/example.com/msp
        OrdererEndpoints:
        - orderer.example.com:7050
        Policies:
          Readers:
            Type: Signature
            Rule: OR('OrdererMSP.member')
          Writers:
            Type: Signature
            Rule: OR('OrdererMSP.member')
          Admins:
            Type: Signature
            Rule: OR('OrdererMSP.admin')
      Policies:
        Readers: *id001
        Writers: *id002
        Admins: *id003
        BlockValidation:
          Type: ImplicitMeta
          Rule: ANY Writers
      Capabilities:
        V2_0: true
    Application:
      Organizations:
      - Name: Org1MSP
        ID: Org1MSP
        MSPDir: /home/ubuntu/fabric-monitoring-lab/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/msp
        AnchorPeers:
        - Host: peer0.org1.example.com
          Port: 7051
        Policies:
          Readers:
            Type: Signature
            Rule: OR('Org1MSP.admin','Org1MSP.peer','Org1MSP.client')
          Writers:
            Type: Signature
            Rule: OR('Org1MSP.admin','Org1MSP.client')
          Admins:
            Type: Signature
            Rule: OR('Org1MSP.admin')
          Endorsement:
            Type: Signature
            Rule: OR('Org1MSP.peer')
      - Name: Org2MSP
        ID: Org2MSP
        MSPDir: /home/ubuntu/fabric-monitoring-lab/fabric-samples/test-network/organizations/peerOrganizations/org2.example.com/msp
        AnchorPeers:
        - Host: peer0.org2.example.com
          Port: 9051
        Policies:
          Readers:
            Type: Signature
            Rule: OR('Org2MSP.admin','Org2MSP.peer','Org2MSP.client')
          Writers:
            Type: Signature
            Rule: OR('Org2MSP.admin','Org2MSP.client')
          Admins:
            Type: Signature
            Rule: OR('Org2MSP.admin')
          Endorsement:
            Type: Signature
            Rule: OR('Org2MSP.peer')
      Capabilities:
        V2_5: true
      Policies:
        Readers: *id001
        Writers: *id002
        Admins: *id003
        LifecycleEndorsement:
          Type: ImplicitMeta
          Rule: MAJORITY Endorsement
        Endorsement:
          Type: ImplicitMeta
          Rule: MAJORITY Endorsement
