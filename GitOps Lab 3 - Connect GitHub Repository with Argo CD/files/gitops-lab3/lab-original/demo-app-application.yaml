apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-nginx-app
  namespace: argocd
  labels:
    app: demo-nginx
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_USERNAME/gitops-demo-app.git
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 2
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
