apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: development-overlay
resources:
- ../../base
namespace: development
commonLabels:
  environment: development
  tier: dev
patches:
- path: webapp/deployment-patch.yaml
  target:
    kind: Deployment
    name: webapp
- path: database/deployment-patch.yaml
  target:
    kind: Deployment
    name: database
- path: webapp/configmap-patch.yaml
  target:
    kind: ConfigMap
    name: webapp-config
namePrefix: ConfigMap-
images:
- name: nginx
  newTag: ""
