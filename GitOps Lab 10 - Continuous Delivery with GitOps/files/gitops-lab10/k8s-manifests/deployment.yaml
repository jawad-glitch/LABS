apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo-app
  namespace: default
  labels: {app: gitops-demo-app}
spec:
  replicas: 2
  selector:
    matchLabels: {app: gitops-demo-app}
  template:
    metadata:
      labels: {app: gitops-demo-app}
    spec:
      containers:
      - name: web
        image: nginx:nonexistent-tag
        ports: [{containerPort: 80}]
        volumeMounts: [{name: html-content, mountPath: /usr/share/nginx/html}]
      volumes:
      - name: html-content
        configMap: {name: app-content}
