admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 15000
static_resources:
  listeners:
  - name: outbound_0.0.0.0_9080
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: outbound_9080
          forward_client_cert_details: SANITIZE_SET
          set_current_client_cert_details:
            uri: true
          route_config:
            name: outbound_9080
            virtual_hosts:
            - name: all
              domains:
              - '*'
              routes:
              - match:
                  prefix: /
                route:
                  cluster: outbound|9080||details.default.svc.cluster.local
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: outbound|9080||details.default.svc.cluster.local
    type: STATIC
    connect_timeout: 2s
    load_assignment:
      cluster_name: outbound|9080||details.default.svc.cluster.local
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 172.18.0.2
                port_value: 9080
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: outbound_.9080_._.details.default.svc.cluster.local
        common_tls_context:
          tls_certificates:
          - certificate_chain:
              filename: /pki/bookinfo-reviews.crt
            private_key:
              filename: /pki/bookinfo-reviews.key
          validation_context:
            trusted_ca:
              filename: /pki/ca.crt
            match_typed_subject_alt_names:
            - san_type: URI
              matcher:
                exact: spiffe://cluster.local/ns/default/sa/bookinfo-details

