apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiresecuritycontext
spec:
  crd:
    spec:
      names:
        kind: K8sRequireSecurityContext
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiresecuritycontext

        pod_containers[c] { c := input.review.object.spec.containers[_] }
        pod_containers[c] { c := input.review.object.spec.template.spec.containers[_] }

        pod_sc := input.review.object.spec.securityContext { input.review.object.spec.containers }
        pod_sc := input.review.object.spec.template.spec.securityContext { input.review.object.spec.template }

        non_root(c) { c.securityContext.runAsNonRoot == true }
        non_root(c) { not c.securityContext.runAsNonRoot == false; pod_sc.runAsNonRoot == true }

        violation[{"msg": msg}] {
          c := pod_containers[_]
          not non_root(c)
          msg := sprintf("Container %v must run as non-root user", [c.name])
        }

        violation[{"msg": msg}] {
          c := pod_containers[_]
          not c.securityContext.readOnlyRootFilesystem == true
          msg := sprintf("Container %v must have read-only root filesystem", [c.name])
        }
