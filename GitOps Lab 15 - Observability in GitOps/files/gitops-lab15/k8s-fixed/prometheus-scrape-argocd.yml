# In-cluster scrape targets = the Services Argo CD already ships (no extra Services needed)
scrape_configs:
  - job_name: argocd-application-controller
    static_configs: [{targets: ['argocd-metrics.argocd.svc:8082']}]
  - job_name: argocd-server
    static_configs: [{targets: ['argocd-server-metrics.argocd.svc:8083']}]
  - job_name: argocd-repo-server
    static_configs: [{targets: ['argocd-repo-server.argocd.svc:8084']}]
