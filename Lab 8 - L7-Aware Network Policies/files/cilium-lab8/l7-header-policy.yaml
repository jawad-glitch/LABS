apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: l7-header-policy
  namespace: l7-policy-demo
spec:
  endpointSelector:
    matchLabels:
      app: httpbin
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: client
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
      rules:
        http:
        - method: "GET"
          path: "/headers"
          headers:
          - "X-Custom-Header: allowed-value"
        - method: "GET"
          path: "/get"
        - method: "GET"
          path: "/status/.*"
