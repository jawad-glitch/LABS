apiVersion: v1
kind: Pod
metadata:
  labels:
    app: shop-api
  name: shop-api-x
  namespace: shop
spec:
  containers:
  - env:
    - name: DB_SECRET_FILE
      value: /vault/secrets/db.env
    image: shop/api:1.0.0
    imagePullPolicy: IfNotPresent
    name: api
    ports:
    - containerPort: 8443
      name: https
    readinessProbe:
      httpGet:
        path: /healthz
        port: 8443
        scheme: HTTPS
      initialDelaySeconds: 3
      periodSeconds: 5
    resources:
      limits:
        cpu: 250m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
    volumeMounts:
    - mountPath: /tls
      name: tls
      readOnly: true
  securityContext:
    runAsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  serviceAccountName: shop-api
  volumes:
  - name: tls
    secret:
      secretName: shop-api-tls

