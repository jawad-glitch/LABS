apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backend-jwt-auth
  namespace: backend
spec:
  endpointSelector:
    matchLabels:
      app: backend
      version: v2
  ingress:
  - fromEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": frontend
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
      rules:
        http:
        - method: "GET"
          path: "/bearer"
          headers:
          - "Authorization: Bearer .*"
        - method: "GET"
          path: "/get"
