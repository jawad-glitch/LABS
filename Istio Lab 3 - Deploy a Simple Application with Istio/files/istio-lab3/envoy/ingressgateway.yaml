admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 15000
static_resources:
  listeners:
  - name: 0.0.0.0_8080
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: http.8080
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
          route_config:
            name: http.8080
            virtual_hosts:
            - name: '*:80'
              domains:
              - '*'
              routes:
              - match:
                  prefix: /frontend
                route:
                  cluster: outbound|8080||hello-frontend.default.svc.cluster.local
                  prefix_rewrite: /
              - match:
                  prefix: /backend
                route:
                  cluster: outbound|8080||hello-backend.default.svc.cluster.local
                  prefix_rewrite: /
              - match:
                  prefix: /
                route:
                  cluster: outbound|8080||hello-frontend.default.svc.cluster.local
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: outbound|8080||hello-frontend.default.svc.cluster.local
    type: STRICT_DNS
    connect_timeout: 1s
    lb_policy: LEAST_REQUEST
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: outbound|8080||hello-frontend.default.svc.cluster.local
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: hello-frontend
                port_value: 8080
  - name: outbound|8080||hello-backend.default.svc.cluster.local
    type: STRICT_DNS
    connect_timeout: 1s
    lb_policy: ROUND_ROBIN
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: outbound|8080||hello-backend.default.svc.cluster.local
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: hello-backend
                port_value: 8080

